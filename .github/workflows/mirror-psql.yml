# Mirrors a public Postgres client image into GHCR so in-cluster Jobs (e.g. the data-reset Job in
# deploy/scripts/) can pull it the same way services do: anonymously from ghcr.io/piraho, arm64.
#
# The OKE nodes are Ampere A1 (arm64) and pull anonymously — they can't reliably pull Docker Hub
# images (ImageInspectError). `imagetools create` is a registry-to-registry copy that preserves the
# full multi-arch manifest (linux/arm64 included), using the built-in GITHUB_TOKEN for GHCR auth.
#
# Run: Actions -> "mirror-psql" -> Run workflow. FIRST run creates a PRIVATE package — make it
# PUBLIC once (piraho packages -> fs-psql -> Package settings -> Change visibility -> Public), since
# the cluster pulls without an imagePullSecret. Subsequent runs stay public.
name: mirror-psql

on:
  workflow_dispatch:
    inputs:
      source:
        description: Source image to mirror (Docker Hub)
        required: true
        default: postgres:16-alpine
      dest_tag:
        description: Destination tag under ghcr.io/piraho/fs-psql
        required: true
        default: "16"

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Mirror multi-arch image into GHCR
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/piraho/fs-psql:${{ inputs.dest_tag }} \
            "${{ inputs.source }}"

      - name: Verify (should list linux/arm64)
        run: docker buildx imagetools inspect ghcr.io/piraho/fs-psql:${{ inputs.dest_tag }}
