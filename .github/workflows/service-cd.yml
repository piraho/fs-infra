# Reusable CD workflow for FamilyShare Java services (github.com/piraho).
#
# Flow: build + test the service -> build & push its container image to the
# GitHub Container Registry (GHCR) as a linux/arm64 image -> `helm upgrade` it
# onto the OKE cluster.
#
# Why arm64: the OCI Always-Free compute is Ampere A1 (Arm), so the cluster
# nodes are arm64 and images must be built for that architecture.
#
# Registry: images live at ghcr.io/piraho/<service> and are pushed with the
# built-in GITHUB_TOKEN (no separate registry credentials needed). This requires
# `permissions: packages: write` on both this workflow and the calling job.
#
# Image visibility: GHCR packages default to PRIVATE on first push. These images
# are pulled anonymously by the cluster (no imagePullSecret is configured), so
# the FIRST time a service's package is created you must make it PUBLIC once in
# the repo's Packages settings (Package settings -> Change visibility -> Public).
# After that, subsequent pushes stay public.
#
# Called by each service repo's .github/workflows/cd.yml on push to main, and by
# fs-infra's deploy-all.yml for full / first-time rollouts. Consumers must pass
# `secrets: inherit` and grant `packages: write` on the calling job.
#
# Required repository / organization secrets (OCI, for OKE access only):
#   OCI_CLI_USER         - OCID of the OCI user used for API-key auth
#   OCI_CLI_TENANCY      - OCID of the tenancy
#   OCI_CLI_FINGERPRINT  - Fingerprint of the API signing key
#   OCI_CLI_KEY_CONTENT  - PEM contents of the API signing private key
#   OCI_CLI_REGION       - OCI region identifier for the CLI (e.g. us-ashburn-1)
#   OKE_CLUSTER_OCID     - OCID of the target OKE cluster
# No OCIR secrets are needed anymore; GHCR auth uses the built-in GITHUB_TOKEN.
name: service-cd

on:
  workflow_call:
    inputs:
      service:
        description: Service name, also the image repo and values file stem (e.g. fs-identity)
        required: true
        type: string
      port:
        description: Container / service port for the service
        required: true
        type: number
      runner:
        # GitHub-hosted by default: a deploy should not depend on one laptop being awake, and
        # ubuntu-latest ships Docker, which the macOS runners do not (so Testcontainers ITs can
        # actually run here).
        #
        # BILLING, because it is not obvious: minutes for a reusable workflow are charged to the
        # CALLING repository, not to the repo that hosts this file. fs-infra is public (free,
        # unlimited), but every service repo that calls this is private, so these runs come out of
        # the private-repo minute allowance — the same pool whose exhaustion is why the self-hosted
        # runner existed. Pass `runner: <label>` from a caller to move that service back onto a
        # self-hosted machine without editing this file.
        description: Runner for the build/deploy job (e.g. ubuntu-latest, or a self-hosted label)
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout service repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build and test
        run: gradle test bootJar --no-daemon

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (linux/arm64)
        # The default runner is amd64 and the cluster is Ampere A1 (arm64), so this is cross-built
        # through the QEMU emulation set up above. The cost is small here by design: the Dockerfiles
        # COPY a jar that was already built natively in the step above, so emulation only has to run
        # whatever RUN layers an image declares (e.g. fs-media's apt-get for cwebp) rather than a
        # full Gradle build. If a service ever grows a heavy RUN layer, give it a native arm64
        # runner via the `runner` input instead of paying for emulation on every deploy.
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/piraho/${{ inputs.service }}:${{ github.sha }}
            ghcr.io/piraho/${{ inputs.service }}:latest

      - name: Configure OCI CLI (install if absent, reuse a shared one)
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: |
          set -euo pipefail
          echo "${HOME}/bin" >> "$GITHUB_PATH"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/bin:${HOME}/.local/bin:${PATH}"
          # Two runner shapes, deliberately:
          #  - Self-hosted Mac: the CLI is preinstalled and that machine is SHARED with another
          #    project's CD, so we must not reinstall into ~/lib/oracle-cli or rewrite ~/.oci.
          #    It has `oci` already, so this branch is skipped and nothing is touched.
          #  - GitHub-hosted (the default now): nothing is preinstalled and the box is thrown away
          #    after the job, so installing here is both necessary and safe. Without this the step
          #    used to hard-fail, which would have broken every deploy the moment CD left the Mac.
          if ! command -v oci >/dev/null 2>&1; then
            python3 -m pip install --user --quiet oci-cli
          fi
          command -v oci >/dev/null 2>&1 || { echo "::error::OCI CLI unavailable after install"; exit 1; }
          CFG_DIR="${RUNNER_TEMP}/oci-piraho"
          mkdir -p "$CFG_DIR"
          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > "${CFG_DIR}/oci_api_key.pem"
          printf 'OCI_API_KEY\n' >> "${CFG_DIR}/oci_api_key.pem"
          chmod 600 "${CFG_DIR}/oci_api_key.pem"
          {
            echo "[DEFAULT]"
            echo "user=${OCI_CLI_USER}"
            echo "fingerprint=${OCI_CLI_FINGERPRINT}"
            echo "tenancy=${OCI_CLI_TENANCY}"
            echo "region=${OCI_CLI_REGION}"
            echo "key_file=${CFG_DIR}/oci_api_key.pem"
          } > "${CFG_DIR}/config"
          chmod 600 "${CFG_DIR}/config"
          echo "OCI_CLI_CONFIG_FILE=${CFG_DIR}/config" >> "$GITHUB_ENV"

      - name: Configure kubeconfig for OKE
        env:
          OKE_CLUSTER_OCID: ${{ secrets.OKE_CLUSTER_OCID }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/bin:${PATH}"
          mkdir -p "${HOME}/.kube"
          oci ce cluster create-kubeconfig \
            --cluster-id "$OKE_CLUSTER_OCID" \
            --region "$OCI_CLI_REGION" \
            --file "${HOME}/.kube/config" \
            --token-version 2.0.0 \
            --kube-endpoint PUBLIC_ENDPOINT

      - name: Checkout fs-infra (Helm chart + values)
        uses: actions/checkout@v4
        with:
          repository: piraho/fs-infra
          ref: main
          path: infra

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm upgrade
        env:
          SERVICE: ${{ inputs.service }}
          PORT: ${{ inputs.port }}
          SHA: ${{ github.sha }}
        run: |
          helm upgrade --install "${SERVICE}" ./infra/deploy/chart \
            -n familyshare --create-namespace \
            -f "./infra/deploy/values/${SERVICE}.yaml" \
            --set image.registry=ghcr.io/piraho \
            --set image.tag="${SHA}" \
            --set port="${PORT}" \
            --wait --timeout 5m
