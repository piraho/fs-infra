# One-shot: export Chicago OCI key from org secrets as a private artifact for local restore.
# Delete this workflow immediately after use.
name: restore-oci-local
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Write OCI credentials bundle (not printed)
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p bundle
          printf '%s\n' "$OCI_CLI_KEY_CONTENT" > bundle/oci_api_key.pem
          {
            echo "user=${OCI_CLI_USER}"
            echo "fingerprint=${OCI_CLI_FINGERPRINT}"
            echo "tenancy=${OCI_CLI_TENANCY}"
            echo "region=${OCI_CLI_REGION}"
          } > bundle/profile.env
          # fingerprint check (safe)
          FP=$(openssl rsa -pubout -in bundle/oci_api_key.pem 2>/dev/null | openssl rsa -pubin -outform DER 2>/dev/null | openssl md5 -c | awk '{print $2}')
          echo "key_fingerprint=${FP}"
          test "$FP" = "$OCI_CLI_FINGERPRINT"

      - name: Upload private bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: piraho-oci-restore
          path: bundle/
          retention-days: 1
          if-no-files-found: error
