# Manual full / first-time rollout orchestrator for all FamilyShare services.
#
# Runs the shared reusable CD pipeline (service-cd.yml) for every service via a
# matrix. Use this for the initial cluster bootstrap or a coordinated full
# redeploy; day-to-day deploys happen automatically from each service repo's own
# cd.yml on push to main.
#
# Requires the same secrets as service-cd.yml (see that file). Secrets are
# forwarded to the reusable workflow with `secrets: inherit`.
name: deploy-all

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Deploy a single service (e.g. fs-health). Leave blank for all."
        required: false
        type: string
        default: ""
      runner:
        # Defaults to a GitHub-hosted runner, and that is deliberate: this workflow is dispatched
        # FROM fs-infra, which is public, so hosted minutes are free here AND available — unlike the
        # private service repos, where a hosted job is assigned no runner at all. It also gets a
        # working Docker daemon, which the self-hosted Macs do not: `docker login` there hangs
        # indefinitely (observed ~30 min) and `docker build` ran ~100 min before being cancelled,
        # so the image steps cannot complete on them.
        description: "Runner for the deploy jobs, as a JSON array of labels."
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read
  packages: write

jobs:
  # The matrix is computed rather than literal so `only` can narrow it. A job-level `if` cannot be
  # used for this: a reusable-workflow call does not expose the `matrix` context to `if`.
  prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          all='[{"service":"fs-identity","port":8081},
                {"service":"fs-family","port":8082},
                {"service":"fs-sharing","port":8083},
                {"service":"fs-profile","port":8084},
                {"service":"fs-calendar","port":8085},
                {"service":"fs-escalation","port":8086},
                {"service":"fs-notification","port":8087},
                {"service":"fs-media","port":8088},
                {"service":"fs-integration","port":8089},
                {"service":"fs-ai","port":8090},
                {"service":"fs-assistant","port":8091},
                {"service":"fs-health","port":8092}]'
          if [ -z "${ONLY}" ]; then
            picked=$(jq -c '.' <<<"$all")
          else
            picked=$(jq -c --arg s "$ONLY" '[.[] | select(.service==$s)]' <<<"$all")
            [ "$(jq 'length' <<<"$picked")" -gt 0 ] || { echo "::error::unknown service '${ONLY}'"; exit 1; }
          fi
          echo "matrix={\"include\":$picked}" >> "$GITHUB_OUTPUT"

  rollout:
    needs: prep
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prep.outputs.matrix) }}
    uses: ./.github/workflows/service-cd.yml
    with:
      service: ${{ matrix.service }}
      port: ${{ matrix.port }}
      runner: ${{ inputs.runner }}
    secrets: inherit
