# FamilyShare local stack — `make dev`. Java services build in-container (multi-stage Gradle).
name: familyshare
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: familyshare, POSTGRES_PASSWORD: familyshare, POSTGRES_DB: familyshare }
    ports: [ "5432:5432" ]
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck: { test: [ "CMD-SHELL", "pg_isready -U familyshare" ], interval: 5s, retries: 12 }
  identity:
    build: ../fs-identity
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/familyshare
      DATABASE_USER: familyshare
      DATABASE_PASSWORD: familyshare
    ports: [ "8081:8081" ]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck: { test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP" ], interval: 10s, retries: 20 }
  family:
    build: ../fs-family
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/familyshare
      DATABASE_USER: familyshare
      DATABASE_PASSWORD: familyshare
      JWKS_URI: http://identity:8081/.well-known/jwks.json
    ports: [ "8082:8082" ]
    depends_on:
      identity: { condition: service_healthy }
  sharing:
    build: ../fs-sharing
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/familyshare
      DATABASE_USER: familyshare
      DATABASE_PASSWORD: familyshare
      JWKS_URI: http://identity:8081/.well-known/jwks.json
      FAMILY_URL: http://family:8082
    ports: [ "8083:8083" ]
    depends_on:
      identity: { condition: service_healthy }
  profile:
    build: ../fs-profile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/familyshare
      DATABASE_USER: familyshare
      DATABASE_PASSWORD: familyshare
      JWKS_URI: http://identity:8081/.well-known/jwks.json
      FAMILY_URL: http://family:8082
      SHARING_URL: http://sharing:8083
    ports: [ "8084:8084" ]
    depends_on:
      identity: { condition: service_healthy }
  calendar:
    build: ../fs-calendar
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/familyshare
      DATABASE_USER: familyshare
      DATABASE_PASSWORD: familyshare
      JWKS_URI: http://identity:8081/.well-known/jwks.json
      FAMILY_URL: http://family:8082
      ESCALATION_URL: http://escalation:8086
    ports: [ "8085:8085" ]
    depends_on:
      identity: { condition: service_healthy }
  escalation:
    build: ../fs-escalation
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/familyshare
      DATABASE_USER: familyshare
      DATABASE_PASSWORD: familyshare
      JWKS_URI: http://identity:8081/.well-known/jwks.json
      FAMILY_URL: http://family:8082
      NOTIFICATION_URL: http://notification:8087
    ports: [ "8086:8086" ]
    depends_on:
      identity: { condition: service_healthy }
  notification:
    build: ../fs-notification
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/familyshare
      DATABASE_USER: familyshare
      DATABASE_PASSWORD: familyshare
      JWKS_URI: http://identity:8081/.well-known/jwks.json
      FAMILY_URL: http://family:8082
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports: [ "8087:8087" ]
    depends_on:
      identity: { condition: service_healthy }
  media:
    build: ../fs-media
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/familyshare
      DATABASE_USER: familyshare
      DATABASE_PASSWORD: familyshare
      JWKS_URI: http://identity:8081/.well-known/jwks.json
      FAMILY_URL: http://family:8082
      SHARING_URL: http://sharing:8083
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: familyshare
      S3_SECRET_KEY: familyshare-secret
    ports: [ "8088:8088" ]
    depends_on:
      identity: { condition: service_healthy }
      minio: { condition: service_started }
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: familyshare
      MINIO_ROOT_PASSWORD: familyshare-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports: [ "9000:9000", "9001:9001" ]
    volumes: [ "miniodata:/data" ]
  mailpit:
    image: axllent/mailpit
    ports: [ "8025:8025" ]
  gateway:
    image: nginx:1.27-alpine
    volumes: [ "./gateway/nginx.conf:/etc/nginx/nginx.conf:ro" ]
    ports: [ "8080:8080" ]
    depends_on: [ identity, family, sharing, profile, calendar, escalation, web ]
  web:
    build: ../fs-web
    environment:
      NEXT_PUBLIC_IDENTITY_URL: http://localhost:8081
      NEXT_PUBLIC_FAMILY_URL: http://localhost:8082
      NEXT_PUBLIC_PROFILE_URL: http://localhost:8084
      NEXT_PUBLIC_CALENDAR_URL: http://localhost:8085
      NEXT_PUBLIC_NOTIFICATION_URL: http://localhost:8087
      NEXT_PUBLIC_MEDIA_URL: http://localhost:8088
    ports: [ "3000:3000" ]
    depends_on: [ identity, family ]
volumes: { pgdata: {}, miniodata: {} }
