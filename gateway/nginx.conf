# Single front door (dev slice of DEC-0020). Production replaces this with Envoy Gateway
# doing edge JWT validation via identity's JWKS; here nginx gives one origin + routing,
# and each Java service still validates the JWT itself (defense in depth holds either way).
events {}
http {
  map $http_x_correlation_id $corr { "" $request_id; default $http_x_correlation_id; }
  server {
    listen 8080;
    proxy_set_header X-Correlation-Id $corr;
    add_header X-Correlation-Id $corr always;
    location /api/identity/  { proxy_pass http://identity:8081/; }
    location /.well-known/   { proxy_pass http://identity:8081/.well-known/; }
    location /api/family/    { proxy_pass http://family:8082/; }
    location /api/sharing/   { proxy_pass http://sharing:8083/; }
    location /api/profile/   { proxy_pass http://profile:8084/; }
    location /api/calendar/  { proxy_pass http://calendar:8085/; }
    location /api/escalation/{ proxy_pass http://escalation:8086/; }
    location /api/notification/ { proxy_pass http://notification:8087/; }
    location / { proxy_pass http://web:3000; }
  }
}
