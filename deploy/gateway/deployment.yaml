apiVersion: apps/v1
kind: Deployment
metadata:
  name: fs-gateway
  namespace: familyshare
  labels:
    app.kubernetes.io/name: fs-gateway
    app.kubernetes.io/part-of: familyshare
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fs-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fs-gateway
        app.kubernetes.io/part-of: familyshare
      annotations:
        # Roll the pods when the Envoy config changes (bump on config edits).
        fs.familyshare.com/config-revision: "2"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101          # envoy user in the official image
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31-latest
          args: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "fs-gateway"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: edge
              containerPort: 8080
              protocol: TCP
            - name: admin
              containerPort: 9901
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: envoy-config
          configMap:
            name: fs-gateway-envoy
            items:
              - key: envoy.yaml
                path: envoy.yaml
