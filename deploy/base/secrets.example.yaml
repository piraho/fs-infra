# #############################################################################
# ##                                                                         ##
# ##   DO NOT COMMIT REAL VALUES.  DO NOT COMMIT REAL VALUES.  DO NOT COMMIT  ##
# ##   REAL VALUES.  This file is an EXAMPLE / TEMPLATE ONLY.                 ##
# ##                                                                         ##
# ##   !!! SECURITY: the Neon connection string was PASTED INTO CHAT and is  ##
# ##   therefore considered EXPOSED. ROTATE the Neon password (and ideally   ##
# ##   the role) in the Neon console BEFORE this cluster serves real data.   ##
# ##   Every placeholder below is a non-secret dummy — never replace them     ##
# ##   in-repo. Create the real Secrets out-of-band (kubectl create secret / ##
# ##   OCI Vault + External Secrets) so plaintext credentials never hit git. ##
# ##                                                                         ##
# ##   The chart projects EVERY key in each Secret as an env var (envFrom     ##
# ##   secretRef), so the key names below are the contract the services read.##
# ##                                                                         ##
# #############################################################################
#
# Four Secrets back this stack:
#   fs-db        — Neon Postgres (ALL services)          -> DATABASE_URL/USER/PASSWORD
#   fs-jwt       — EC P-256 JWK signing key (fs-identity) -> FAMILYSHARE_JWT_SIGNING_KEY
#   fs-media-s3  — OCI Object Storage S3-compat (fs-media)-> S3_*
#   fs-smtp      — SMTP relay (fs-notification)           -> SMTP_*
#
# =============================================================================
# Preferred: create imperatively (nothing sensitive touches the repo)
# =============================================================================
#
#   kubectl create namespace familyshare
#
#   # --- fs-db : Neon Postgres (use the POOLER host, sslmode=require) ---------
#   # Grab the pooled connection string from the Neon console → Connection Details
#   # → "Pooled connection". The pooler host has a "-pooler" suffix.
#   kubectl -n familyshare create secret generic fs-db \
#     --from-literal=DATABASE_URL='jdbc:postgresql://<neon-pooler-host>/neondb?sslmode=require' \
#     --from-literal=DATABASE_USER='neondb_owner' \
#     --from-literal=DATABASE_PASSWORD='<rotate-me>'
#
#   # --- fs-jwt : EC P-256 JWK, created FROM A FILE (JSON is shell-hostile) ----
#   # 1) Generate the JWK and save it to a file:
#   docker run --rm ghcr.io/piraho/fs-identity:latest gen-jwk > jwk.json
#   # 2) Load the file's contents as the FAMILYSHARE_JWT_SIGNING_KEY key:
#   kubectl -n familyshare create secret generic fs-jwt \
#     --from-file=FAMILYSHARE_JWT_SIGNING_KEY=jwk.json
#   #    ...then shred it:  rm -f jwk.json
#
#   # --- fs-media-s3 : OCI Object Storage S3-compatible endpoint ---------------
#   kubectl -n familyshare create secret generic fs-media-s3 \
#     --from-literal=S3_ENDPOINT='https://<ns>.compat.objectstorage.<region>.oraclecloud.com' \
#     --from-literal=S3_PUBLIC_ENDPOINT='https://cdn.familyshare.com' \
#     --from-literal=S3_BUCKET='familyshare-media' \
#     --from-literal=S3_ACCESS_KEY='<access-key>' \
#     --from-literal=S3_SECRET_KEY='<secret-key>'
#
#   # --- fs-smtp : email relay -------------------------------------------------
#   kubectl -n familyshare create secret generic fs-smtp \
#     --from-literal=SMTP_HOST='email-smtp.us-east-1.amazonaws.com' \
#     --from-literal=SMTP_PORT='587'
#     # add SMTP_USER / SMTP_PASS for a real relay (PRODUCTION-READINESS.md 1.3)
#
#   # --- Native push (fs-apns-key / fs-fcm-sa) --------------------------------
#   # PROD: these are OCI-Vault-backed via External Secrets — see deploy/secrets/
#   # (Vault entries fs-apns-key-p8 + fs-fcm-service-account). Nothing to do here.
#   # Local/dev clusters WITHOUT ESO can create them directly from the key files:
#   kubectl -n familyshare create secret generic fs-apns-key \
#     --from-file=AuthKey.p8=AuthKey_<KEYID>.p8      # Apple APNs .p8, then shred it
#   kubectl -n familyshare create secret generic fs-fcm-sa \
#     --from-file=sa.json=<project>-firebase-adminsdk-*.json   # Firebase SEND key, then shred it
#
# =============================================================================
# The manifests below are the DECLARATIVE equivalent, using stringData so you
# can read/edit the placeholders. Replace every <...> / REPLACE_ME before
# applying, and DO NOT commit the edited copy.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: fs-db
  namespace: familyshare
type: Opaque
stringData:
  # Neon: use the POOLER host and keep sslmode=require. The chart sets a small
  # Hikari pool per service (SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=3) so all
  # nine services stay under Neon's free-tier connection cap.
  DATABASE_URL: "jdbc:postgresql://<neon-pooler-host>/neondb?sslmode=require"
  DATABASE_USER: "neondb_owner"
  DATABASE_PASSWORD: "<rotate-me>"
---
apiVersion: v1
kind: Secret
metadata:
  name: fs-jwt
  namespace: familyshare
type: Opaque
stringData:
  # EC P-256 (ES256) private signing key as a JWK JSON document. fs-identity
  # signs access tokens with it and publishes the matching public JWK at
  # /.well-known/jwks.json. Generate with:
  #   docker run --rm ghcr.io/piraho/fs-identity:latest gen-jwk
  # (Declared inline here for readability; prefer `--from-file` imperatively so
  # the JSON is not mangled by YAML/shell quoting.)
  FAMILYSHARE_JWT_SIGNING_KEY: '<EC P-256 JWK JSON — generate via: docker run --rm ghcr.io/piraho/fs-identity:latest gen-jwk>'
---
apiVersion: v1
kind: Secret
metadata:
  name: fs-media-s3
  namespace: familyshare
type: Opaque
stringData:
  # OCI Object Storage, S3-compatible endpoint.
  S3_ENDPOINT: "https://REPLACE_ME-object-storage-endpoint"
  S3_PUBLIC_ENDPOINT: "https://REPLACE_ME-public-cdn-or-bucket-endpoint"
  S3_BUCKET: "familyshare-media"
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: fs-smtp
  namespace: familyshare
type: Opaque
stringData:
  SMTP_HOST: "REPLACE_ME-smtp-host"
  SMTP_PORT: "587"
  # For a production relay also add (and have EmailChannel read) these:
  # SMTP_USER: "REPLACE_ME"
  # SMTP_PASS: "REPLACE_ME"
