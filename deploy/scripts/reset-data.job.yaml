# One-shot Job that runs deploy/scripts/reset-data.sql against the Neon DB shared by all services.
# It reads DB credentials from the existing `fs-db` Secret — no credentials live in this file.
#
# Usage (from deploy/scripts/):
#   kubectl -n familyshare create configmap fs-reset-data-sql --from-file=reset-data.sql=./reset-data.sql
#   kubectl -n familyshare apply -f reset-data.job.yaml
#   kubectl -n familyshare logs -f job/fs-reset-data
#   # when done:
#   kubectl -n familyshare delete job/fs-reset-data configmap/fs-reset-data-sql
#
# WARNING: DESTRUCTIVE — truncates every application table. Take a Neon branch/snapshot first.
apiVersion: batch/v1
kind: Job
metadata:
  name: fs-reset-data
  namespace: familyshare
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: fs-reset-data }
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              HOST=$(printf '%s' "$DATABASE_URL" | sed -E 's#jdbc:postgresql://([^/]+)/.*#\1#')
              DB=$(printf '%s' "$DATABASE_URL"   | sed -E 's#.*/([^/?]+).*#\1#')
              echo "Resetting database '$DB' on host '$HOST' ..."
              PGPASSWORD="$DATABASE_PASSWORD" psql \
                "host=$HOST dbname=$DB user=$DATABASE_USER sslmode=require" \
                -v ON_ERROR_STOP=1 -f /sql/reset-data.sql
              echo "Reset complete."
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: fs-db, key: DATABASE_URL } }
            - name: DATABASE_USER
              valueFrom: { secretKeyRef: { name: fs-db, key: DATABASE_USER } }
            - name: DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: fs-db, key: DATABASE_PASSWORD } }
          volumeMounts:
            - { name: sql, mountPath: /sql, readOnly: true }
      volumes:
        - name: sql
          configMap: { name: fs-reset-data-sql }
