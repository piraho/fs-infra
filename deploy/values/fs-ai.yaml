# fs-ai — AI gateway (OpenAI/Claude/Gemini + exact & semantic response cache). DNS: http://fs-ai:8090.
# Requires the pgvector extension in the DB (Neon: enable it once) for the semantic cache.
image:
  repository: fs-ai
port: 8090

env:
  JWKS_URI: http://fs-identity:8081/.well-known/jwks.json
  # Default for non-health AI calls (chat/completions). fs-health vision parsing sets its own provider.
  AI_DEFAULT_PROVIDER: anthropic
  # Neon free tier caps total connections; keep each service's pool tiny.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
  INTERNAL_AUTH_ENFORCE: "true" # reject /internal/* without a valid X-Internal-Key (C1/C3/H3)

# DATABASE_* from Secret fs-db; provider API keys (OPENAI_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY)
# from Secret fs-ai-keys (OCI Vault via ESO — see deploy/secrets/external-secrets.yaml).
envFrom:
  - fs-db
  - fs-ai-keys
  - fs-internal-auth # INTERNAL_API_KEY — gates /internal/* (security review C1/C3/H3)
