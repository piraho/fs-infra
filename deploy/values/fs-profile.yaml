# fs-profile — profiles/medical + medication data. DNS: http://fs-profile:8084.
image:
  repository: fs-profile
port: 8084

env:
  JWKS_URI: http://fs-identity:8081/.well-known/jwks.json
  FAMILY_URL: http://fs-family:8082
  SHARING_URL: http://fs-sharing:8083
  # Neon free tier caps total connections; keep each service's pool tiny.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"

# DATABASE_URL / DATABASE_USER / DATABASE_PASSWORD come from Secret fs-db.
envFrom:
  - fs-db
