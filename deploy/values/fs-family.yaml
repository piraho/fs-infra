# fs-family — families, memberships, invitations. DNS: http://fs-family:8082.
image:
  repository: fs-family
port: 8082

env:
  # Resource server: validate ES256 JWTs against identity's JWKS.
  JWKS_URI: http://fs-identity:8081/.well-known/jwks.json
  # Neon free tier caps total connections; keep each service's pool tiny.
  MEDIA_URL: http://fs-media:8088   # fs-family -> fs-media E2EE re-key on member removal (H5)
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
  INTERNAL_AUTH_ENFORCE: "true"   # reject /internal/* without a valid X-Internal-Key (C1/C3/H3)

# DATABASE_URL / DATABASE_USER / DATABASE_PASSWORD come from Secret fs-db.
envFrom:
  - fs-db
  - fs-internal-auth   # INTERNAL_API_KEY — gates /internal/* (security review C1/C3/H3)
