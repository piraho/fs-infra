# fs-notification — email/SMS/push fan-out. DNS: http://fs-notification:8087.
image:
  repository: fs-notification
port: 8087

env:
  JWKS_URI: http://fs-identity:8081/.well-known/jwks.json
  FAMILY_URL: http://fs-family:8082
  AI_URL: http://fs-ai:8090   # fs-ai gateway (AiClient)
  # Neon free tier caps total connections; keep each service's pool tiny.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"

# fs-db     -> DATABASE_URL / DATABASE_USER / DATABASE_PASSWORD
# fs-smtp   -> SMTP_HOST / SMTP_PORT (add SMTP_USER / SMTP_PASS keys for a real relay).
# fs-twilio -> TWILIO_ACCOUNT_SID / TWILIO_API_KEY_SID / TWILIO_API_KEY_SECRET / TWILIO_FROM_NUMBER
#              (synced from OCI Vault by External Secrets — see deploy/secrets/).
envFrom:
  - fs-db
  - fs-smtp
  - fs-twilio
  - fs-internal-auth   # INTERNAL_API_KEY — gates /internal/* (security review C1/C3/H3)
