# fs-integration — external API / client-credentials + X-Api-Key surface.
# DNS: http://fs-integration:8089.
image:
  repository: fs-integration
port: 8089

env:
  JWKS_URI: http://fs-identity:8081/.well-known/jwks.json
  FAMILY_URL: http://fs-family:8082
  IDENTITY_URL: http://fs-identity:8081
  PROFILE_URL: http://fs-profile:8084
  # Neon free tier caps total connections; keep each service's pool tiny.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"

# DATABASE_URL / DATABASE_USER / DATABASE_PASSWORD come from Secret fs-db.
envFrom:
  - fs-db
  - fs-internal-auth   # INTERNAL_API_KEY — gates /internal/* (security review C1/C3/H3)
