# Loki + Promtail + Grafana for the OCI "Always Free" OKE cluster.
# Chart: grafana/loki-stack (single-binary Loki — right-sized for one Ampere A1 node,
# NOT the microservices/SimpleScalable layout). Install with release name "loki" so the
# service is `loki` and Grafana is `loki-grafana` (see README).
#
# Free-tier constraints baked in here:
#   * single Loki replica (no ring/replication) — one node, minimal memory
#   * 50Gi PVC on oci-bv — OCI Block Volume minimum billable size is 50GB; smaller is
#     rounded up and wastes the request, so ask for 50Gi outright
#   * 10-day retention via the compactor (240h) so the volume never fills
#   * explicit CPU/memory limits so logging can't starve the app pods on a 1-node cluster
#   * arm64 images (loki-stack images are multi-arch, so no tag override needed)

loki:
  enabled: true
  isDefault: false                     # app metrics/datasource default stays with Grafana's Loki DS below
  persistence:
    enabled: true
    storageClassName: oci-bv
    accessModes: ["ReadWriteOnce"]
    size: 50Gi                         # OCI Block Volume min is 50GB — do not lower
  # Single-process config with boltdb-shipper + filesystem object store and the compactor
  # doing time-based retention (no external object storage on the free tier).
  config:
    auth_enabled: false
    compactor:
      working_directory: /data/loki/compactor
      shared_store: filesystem
      compaction_interval: 10m
      retention_enabled: true          # the compactor enforces retention_period below
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
    ingester:
      chunk_idle_period: 3m
      chunk_retain_period: 1m
      max_chunk_age: 1h
    limits_config:
      retention_period: 240h           # 10 days
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_streams_per_user: 0
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    storage_config:
      boltdb_shipper:
        active_index_directory: /data/loki/boltdb-shipper-active
        cache_location: /data/loki/boltdb-shipper-cache
        cache_ttl: 24h
        shared_store: filesystem
      filesystem:
        directory: /data/loki/chunks
    table_manager:
      retention_deletes_enabled: false # retention is handled by the compactor, not table-manager
      retention_period: 0
  resources:
    limits:   { cpu: 500m, memory: 512Mi }
    requests: { cpu: 100m, memory: 256Mi }

promtail:
  enabled: true                        # DaemonSet: tails every pod's stdout/stderr on the node
  resources:
    limits:   { cpu: 200m, memory: 256Mi }
    requests: { cpu: 50m,  memory: 128Mi }
  config:
    # Honor the x-correlation-id the gateway stamps so a request can be traced end-to-end in Grafana.
    snippets:
      pipelineStages:
        - cri: {}

grafana:
  enabled: true
  persistence:
    enabled: false                     # dashboards are ephemeral; the admin password lives in a Secret
  # Pre-wire the Loki datasource so "Explore" works immediately after install.
  sidecar:
    datasources:
      enabled: true
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          url: http://loki:3100         # release name "loki" -> service "loki"
          access: proxy
          isDefault: true
  resources:
    limits:   { cpu: 300m, memory: 256Mi }
    requests: { cpu: 50m,  memory: 128Mi }

# Everything else in the umbrella chart stays off — this is logging only, not a metrics stack.
prometheus:
  enabled: false
filebeat:
  enabled: false
fluent-bit:
  enabled: false
logstash:
  enabled: false
